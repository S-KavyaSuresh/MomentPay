<!-- <!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MomentPay · give together</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Manrope:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#070b1a;--txt:#eef1ff;--mute:#9ba5c9;--line:rgba(255,255,255,.13);--glass:rgba(255,255,255,.06);--gold:#ffcf5c;--teal:#3de0c4;--vio:#8b7bff;--rose:#ff7eb6;--g:linear-gradient(135deg,#3de0c4,#8b7bff)}
*{box-sizing:border-box}
body{margin:0;background:var(--ink);color:var(--txt);font:15px/1.55 Manrope,system-ui,sans-serif;min-height:100vh;overflow-x:hidden}
body:before,body:after{content:"";position:fixed;width:60vmax;height:60vmax;border-radius:50%;filter:blur(100px);opacity:.33;z-index:-1;animation:drift 22s ease-in-out infinite alternate}
body:before{background:var(--teal);top:-28vmax;left:-18vmax}body:after{background:var(--vio);bottom:-28vmax;right:-18vmax;animation-delay:-9s}
@keyframes drift{to{transform:translate(8vmax,6vmax) scale(1.15)}}@keyframes rise{from{opacity:0;transform:translateY(22px)}}@keyframes pop{from{opacity:0;transform:scale(.85) translateY(10px)}}
@keyframes float{50%{transform:translateY(-10px) rotate(3deg)}}@keyframes spin{50%{transform:rotateY(180deg)}}@keyframes flow{to{background-position:0 0,300% 0}}@keyframes pulse{50%{transform:scale(1.25);opacity:.6}}@keyframes shim{to{background-position:-200% 0}}
h1,h2,h3{font-family:Fraunces,Georgia,serif;font-weight:700;margin:.1em 0;line-height:1.08;letter-spacing:-.015em}
.big{font-size:clamp(2.4rem,6vw,4.2rem)}.sub{color:var(--mute);font-size:1.1rem;max-width:34em}.mute{color:var(--mute)}
#view{max-width:1120px;margin:0 auto;padding:18px 18px 90px}#view.in>*{animation:rise .65s cubic-bezier(.2,.8,.2,1) both}#view.in>*:nth-child(2){animation-delay:.07s}#view.in>*:nth-child(3){animation-delay:.14s}
nav{display:flex;justify-content:space-between;align-items:center;padding:6px 0 18px}.logo{font:700 1.4rem Fraunces,serif;display:flex;gap:10px;align-items:center;cursor:pointer}.logo i{width:30px;height:30px;border-radius:50%;background:var(--g);box-shadow:0 0 24px var(--teal);animation:pulse 3s infinite}
.glass{background:var(--glass);border:1px solid var(--line);border-radius:22px;backdrop-filter:blur(18px);transition:transform .35s cubic-bezier(.2,.8,.2,1),box-shadow .35s,border-color .35s}
.lift{cursor:pointer;overflow:hidden}.lift:hover{transform:translateY(-8px);box-shadow:0 26px 60px -22px rgba(61,224,196,.45);border-color:rgba(61,224,196,.55)}
.pad{padding:20px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:18px;margin-top:18px}
.cov{height:104px;display:grid;place-items:center;font-size:48px;background:linear-gradient(135deg,hsl(var(--h) 65% 38%),hsl(calc(var(--h) + 70) 70% 28%))}.cov span{display:inline-block;animation:float 4.5s ease-in-out infinite;transition:transform .45s cubic-bezier(.2,1.6,.4,1)}.lift:hover .cov span{transform:scale(1.3) rotate(-10deg)}
.btn{position:relative;overflow:hidden;border:0;border-radius:14px;padding:12px 20px;font:800 14px Manrope,sans-serif;color:#06121a;background:var(--g);cursor:pointer;transition:transform .2s,box-shadow .3s;margin:4px 6px 4px 0}
.btn:hover{transform:translateY(-2px) scale(1.03);box-shadow:0 12px 32px -8px rgba(61,224,196,.65)}.btn:active{transform:scale(.96)}
.btn:after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.55) 50%,transparent 70%);transform:translateX(-130%);transition:transform .7s}.btn:hover:after{transform:translateX(130%)}
.btn.ghost{background:transparent;color:var(--txt);border:1px solid var(--line)}.btn.gold{background:linear-gradient(135deg,var(--gold),var(--rose))}.btn.sm{padding:8px 14px}
.link{background:none;border:0;color:var(--teal);cursor:pointer;font:700 14px Manrope;padding:4px 0}.link:hover{text-decoration:underline}
input,textarea,select{width:100%;padding:12px 14px;margin:6px 0;border:1px solid var(--line);border-radius:14px;background:rgba(5,8,22,.55);color:var(--txt);font:inherit;transition:border-color .25s,box-shadow .25s}
input:focus,textarea:focus,select:focus{outline:0;border-color:var(--teal);box-shadow:0 0 0 4px rgba(61,224,196,.18)}textarea{min-height:130px;resize:vertical}select option{color:#000}
label{font-weight:700;display:block;margin-top:12px}.chk{display:flex;gap:8px;align-items:center;font-weight:500}.chk input{width:auto;margin:0}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0}.chip{border:1px solid var(--line);background:var(--glass);color:var(--txt);border-radius:99px;padding:6px 14px;cursor:pointer;font:600 13px Manrope;transition:all .2s}.chip:hover,.chip.on{background:var(--g);color:#06121a;transform:translateY(-2px);border-color:transparent}
.tag{font-size:12px;font-weight:700;padding:3px 10px;border-radius:99px;background:rgba(61,224,196,.16);color:var(--teal)}.tag.g{background:rgba(255,207,92,.16);color:var(--gold)}.tag.r{background:rgba(255,126,126,.18);color:#ff9a9a}
.ava{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:50%;font:800 12px Manrope;color:#fff;border:2px solid var(--ink);margin-right:-8px;flex:none}
.hero{display:grid;grid-template-columns:1.25fr 1fr;gap:40px;align-items:center;min-height:72vh}.floaters{position:relative;height:190px;margin-top:26px}
.fl{position:absolute;padding:12px 16px;border-radius:16px;background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(14px);animation:float 6s ease-in-out infinite}.fl b{display:block;color:var(--gold)}.fl.a{left:0;top:0}.fl.b{left:200px;top:70px;animation-delay:-2s}.fl.c{left:30px;top:130px;animation-delay:-4s}
.mv{display:grid;grid-template-columns:1fr 370px;gap:18px;align-items:start}
.chat{display:flex;flex-direction:column;height:76vh;min-height:540px;overflow:hidden}.chead{display:flex;gap:14px;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line)}.chead .em{font-size:30px}
.msgs{flex:1;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:10px;scroll-behavior:smooth}.empty{margin:auto;text-align:center;color:var(--mute);max-width:260px}
.b{max-width:78%;padding:9px 14px;border-radius:18px 18px 18px 4px;background:rgba(255,255,255,.09);animation:pop .4s cubic-bezier(.2,1.4,.4,1);word-wrap:break-word}.b time{display:block;font-size:11px;opacity:.55;text-align:right}.who{display:block;font-size:12px;font-weight:800;color:var(--teal)}
.b.me{align-self:flex-end;border-radius:18px 18px 4px 18px;background:linear-gradient(135deg,#2cae9a,#6a5cf0)}.b.me .who{display:none}
.b.ai{align-self:center;max-width:92%;border:1.5px solid transparent;background:linear-gradient(#0e1534,#0e1534) padding-box,linear-gradient(120deg,var(--teal),var(--vio),var(--rose),var(--teal)) border-box;background-size:auto,300% 100%;animation:pop .4s both,flow 7s linear infinite}.b.ai .who{color:var(--rose)}
.pay{align-self:center;display:flex;gap:12px;align-items:center;padding:12px 18px;border-radius:18px;background:linear-gradient(135deg,rgba(255,207,92,.22),rgba(255,126,182,.14));border:1px solid rgba(255,207,92,.45);animation:pop .55s cubic-bezier(.2,1.5,.4,1);max-width:92%}.pay .coin{font-size:28px;animation:spin 2.6s ease-in-out infinite}.pay span{color:var(--mute);font-size:13px}
.payd{max-height:0;overflow:hidden;transition:max-height .5s cubic-bezier(.2,.8,.2,1);border-top:0 solid var(--line);background:rgba(0,0,0,.2)}.payd.open{max-height:420px;border-top-width:1px}.payd>div{padding:14px 16px}
.comp{display:flex;gap:8px;padding:12px;border-top:1px solid var(--line)}.comp input{margin:0}
.ring{display:grid;place-items:center;padding:20px;position:relative}.ring svg{width:170px;transform:rotate(-90deg)}.trk,.bar{fill:none;stroke-width:9}.trk{stroke:rgba(255,255,255,.1)}.bar{stroke:url(#gr);stroke-linecap:round;transition:stroke-dashoffset 1.4s cubic-bezier(.2,.8,.2,1)}
.mid{position:absolute;text-align:center}.mid b{font:700 2rem Fraunces,serif;display:block}.mid span{font-size:12px;color:var(--mute)}
.row{display:flex;gap:10px;align-items:center;padding:8px 0}.row .grow{flex:1}.mini{height:5px;border-radius:9px;background:rgba(255,255,255,.1);overflow:hidden;margin-top:4px}.mini i{display:block;height:100%;background:var(--g);transition:width 1s}
.opt{border:1px solid var(--line);border-radius:16px;padding:14px;margin:12px 0;transition:border-color .25s,background .25s}.opt:hover{border-color:rgba(61,224,196,.5);background:rgba(61,224,196,.05)}
.prod{display:flex;gap:12px;align-items:center;padding:10px;border:1px solid var(--line);border-radius:14px;margin:8px 0;transition:transform .25s}.prod:hover{transform:translateX(4px)}.prod img{width:54px;height:54px;object-fit:contain;background:#fff;border-radius:10px}.prod>div{flex:1;font-size:13px}.prod.best{border-color:var(--gold);background:rgba(255,207,92,.08)}
.why{border-left:3px solid var(--gold);padding:8px 12px;background:rgba(255,207,92,.08);border-radius:8px;font-size:13px}
.load{display:grid;place-items:center;gap:16px;min-height:50vh;color:var(--mute)}.orb{width:56px;height:56px;border-radius:50%;background:var(--g);animation:pulse 1.4s infinite;box-shadow:0 0 50px var(--teal)}
.shimrow{height:52px;border-radius:14px;margin:8px 0;background:linear-gradient(90deg,rgba(255,255,255,.05) 25%,rgba(255,255,255,.14) 50%,rgba(255,255,255,.05) 75%);background-size:200% 100%;animation:shim 1.3s infinite}
#toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,30px);background:#111a3a;border:1px solid var(--line);padding:12px 20px;border-radius:16px;opacity:0;pointer-events:none;transition:all .4s cubic-bezier(.2,1.4,.4,1);max-width:90vw;z-index:9;box-shadow:0 20px 50px -10px #000}#toast.on{opacity:1;transform:translate(-50%,0)}
#toasts{position:fixed;top:78px;right:16px;z-index:20;display:flex;flex-direction:column;gap:10px;width:min(370px,92vw)}
@media(max-width:640px){#toasts{top:116px}}
nav>div{display:flex;align-items:center;flex-wrap:wrap;gap:4px;justify-content:flex-end}
.tt{display:flex;gap:12px;align-items:flex-start;padding:13px 16px 15px;border-radius:16px;background:rgba(17,26,58,.94);border:1px solid var(--line);backdrop-filter:blur(16px);box-shadow:0 18px 40px -12px #000;animation:slideIn .5s cubic-bezier(.2,1.2,.4,1) both;cursor:pointer;position:relative;overflow:hidden;font-weight:600}
.tt.out{animation:slideOut .4s ease both}.tt i{font-style:normal;font-size:21px}.tt:after{content:"";position:absolute;left:0;bottom:0;height:3px;background:var(--g);animation:life 5s linear forwards}
@keyframes slideIn{from{opacity:0;transform:translateX(70px)}}@keyframes slideOut{to{opacity:0;transform:translateX(70px)}}@keyframes life{from{width:100%}to{width:0}}
.bell{position:relative;display:inline-grid;place-items:center;flex:0 0 38px;width:38px;height:38px;padding:0;line-height:1;background:var(--glass);border:1px solid var(--line);border-radius:50%;cursor:pointer;font-size:17px;color:var(--txt);transition:transform .25s,border-color .25s;margin-right:10px;vertical-align:middle}.bell:hover{transform:rotate(-12deg) scale(1.1);border-color:var(--teal)}
.bell b{position:absolute;top:-5px;right:-5px;min-width:17px;text-align:center;background:var(--rose);color:#fff;border:2px solid var(--ink);border-radius:99px;font-size:10px;line-height:14px;padding:0 4px;display:none;pointer-events:none}.bell.has b{display:block}.bell.ring{animation:ring .9s}
@keyframes ring{20%{transform:rotate(20deg)}40%{transform:rotate(-16deg)}60%{transform:rotate(10deg)}80%{transform:rotate(-6deg)}}
.nrow{display:flex;gap:14px;padding:16px 18px;border-bottom:1px solid var(--line);cursor:pointer;transition:background .2s,padding-left .2s}.nrow:hover{background:rgba(255,255,255,.05);padding-left:24px}.nrow.new{border-left:3px solid var(--teal);background:rgba(61,224,196,.05)}
.dgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:18px}.opt2{transition:transform .35s,border-color .35s,box-shadow .35s}.opt2:hover{transform:translateY(-6px);border-color:rgba(61,224,196,.5);box-shadow:0 24px 50px -22px rgba(61,224,196,.5)}.opt2 .e{font-size:38px;margin-bottom:6px;display:inline-block;transition:transform .4s cubic-bezier(.2,1.6,.4,1)}.opt2:hover .e{transform:scale(1.25) rotate(-8deg)}
#fx{position:fixed;inset:0;pointer-events:none;z-index:8}
@media(max-width:900px){.mv,.hero{grid-template-columns:1fr}.chat{height:68vh}.floaters{display:none}}
@media(prefers-reduced-motion:reduce){*,:before,:after{animation:none!important;transition:none!important}}
</style></head>
<body><div id="view"></div><div id="toasts"></div><canvas id="fx"></canvas>
<script>
const $=s=>document.querySelector(s),V=$('#view');
let T=localStorage.t||'',ME=null,CFG={},D=null,SR=null,REC=null,US=[],LAST=0,SIG='',CUR=0,CURH='',VIEW='',NP=null,NMAX=-1,NUN=0,NITEMS=[],DSIG='',AIS=null,MEM={},MR=[],POLL=null,IDEAS=null,PPD=false;
const money=n=>'$'+Number(n).toFixed(2),rnd=a=>a[Math.floor(Math.random()*a.length)];
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const PAYL=['Your value has safely changed hands.','The digital currents have carried your treasure through.','A successful handshake between balances.','Kindness, delivered at the speed of light.'];
const PAYL_CALM=['Your contribution is safely in.','Steady hands, steady support. It has arrived.','One more person standing behind them.','Quietly, surely, it found its way there.'];
const payLine=d=>rnd((d&&d.kind=='emergency')?PAYL_CALM:PAYL);
const boomIf=d=>{if(!d||d.kind!='emergency')boom()};
const LOAD=['Weaving your moment together…','Asking the coins to line up…','Warming up the group chat…','Polishing the pool…'];
const toast=(t,icon='✨')=>{const c=$('#toasts'),e=document.createElement('div');e.className='tt';e.innerHTML=`<i>${icon}</i><div>${esc(t)}</div>`;const kill=()=>{e.classList.add('out');setTimeout(()=>e.remove(),400)};e.onclick=kill;c.appendChild(e);setTimeout(kill,5000);while(c.children.length>4)c.firstChild.remove()};
const run=f=>async(...a)=>{try{await f(...a)}catch(e){toast('A small knot in the thread: '+e.message)}};
const api=async(p,m='GET',b)=>{const r=await fetch('/api'+p,{method:m,headers:{'Content-Type':'application/json',Authorization:T},body:b?JSON.stringify(b):undefined});
 const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(typeof j.detail==='string'?j.detail:'a field needs a little more love');return j};
const go=h=>{V.innerHTML=h;V.classList.remove('in');void V.offsetWidth;V.classList.add('in');scrollTo(0,0);setPill();requestAnimationFrame(()=>document.querySelectorAll('.bar[data-o]').forEach(b=>b.style.strokeDashoffset=b.dataset.o))};
const loading=()=>go(`<div class="load"><div class="orb"></div><p>${rnd(LOAD)}</p></div>`);
const hue=s=>[...String(s)].reduce((a,c)=>a*31+c.charCodeAt(0),7)%360;
const ava=n=>`<span class="ava" style="background:hsl(${hue(n)} 60% 45%)" title="${esc(n)}">${esc(String(n).split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase())}</span>`;
const emo=m=>m.kind=='emergency'?'🆘':/birth/i.test(m.occasion)?'🎂':/house|home/i.test(m.occasion)?'🏡':/grad/i.test(m.occasion)?'🎓':/baby/i.test(m.occasion)?'👶':/wed|marr/i.test(m.occasion)?'💍':'🎁';
const tm=t=>new Date(t.replace(' ','T')+'Z').toLocaleTimeString([],{hour:'numeric',minute:'2-digit'});
function boom(){const c=$('#fx'),x=c.getContext('2d');c.width=innerWidth;c.height=innerHeight;const P=[...Array(140)].map(()=>({x:innerWidth/2,y:innerHeight*.65,vx:(Math.random()-.5)*18,vy:-Math.random()*18-4,s:5+Math.random()*7,c:`hsl(${Math.random()*360} 90% 62%)`,r:Math.random()*6}));let f=0;(function t(){x.clearRect(0,0,c.width,c.height);P.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.45;p.r+=.2;x.fillStyle=p.c;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillRect(-p.s/2,-p.s/2,p.s,p.s*.6);x.restore()});++f<120?requestAnimationFrame(t):x.clearRect(0,0,c.width,c.height)})()}

const setPill=()=>{document.querySelectorAll('.aipill').forEach(e=>{e.className='tag aipill'+(AIS&&!AIS.ok?' r':'');e.textContent=!AIS?'Pip is waking…':AIS.ok?'✨ Pip is online':'⚠ Pip is offline';e.title=(AIS&&AIS.error)||''});const b=$('#aibanner');if(b&&AIS&&!AIS.ok)b.innerHTML=`<div class="glass pad" style="margin:14px 0;border-color:#ff8f8f"><b>Pip's AI isn't connected, so you only get plain templates.</b><p class="mute" style="margin:4px 0">${esc(AIS.error)}<br>Get a free key at aistudio.google.com (Gemini) or console.groq.com, add it to .env as GEMINI_API_KEY or GROQ_API_KEY, and restart the server.</p></div>`};
async function boot(){fetch('/api/ai/status').then(r=>r.json()).then(r=>{AIS=r;setPill()}).catch(()=>{});CFG=await api('/config');if(T){try{ME=await api('/me')}catch{T=''}}ME?route():authView(0)}
function route(){if(!NP)startN();const h=location.hash,m=h.match(/^#m(\d+)(\/decide)?/);h=='#notifications'?notifView():h=='#profile'?profileView():m?(m[2]?decideView(+m[1]):openM(+m[1])):home()}
const nav=()=>`<nav><div class="logo" onclick="home()"><i></i>MomentPay</div><div><span class="tag aipill" style="margin-right:12px"></span><button type="button" class="bell ${NUN?'has':''}" onclick="notifView()" title="Notifications" aria-label="Notifications">🔔<b>${NUN>9?'9+':NUN}</b></button>${ava(ME.name)}<button class="link" style="margin-left:14px" onclick="profileView()">Profile</button><button class="link" style="margin-left:14px" onclick="logout()">Log out</button></div></nav>`;
function logout(noPP){clearInterval(POLL);clearInterval(NP);NP=null;NUN=0;localStorage.t=T='';ME=null;if(!noPP&&localStorage.ppu)ppSignOut();authView(0)}

function authView(reg){clearInterval(POLL);D=null;go(`<div class="hero"><div><div class="logo" style="margin-bottom:28px"><i></i>MomentPay</div>
<h1 class="big">Some moments are too big for one wallet.</h1><p class="sub">Gather your people, give what you can, and let Pip weave the rest: the right words, the right gift, and fair-share refunds on whatever is left.</p>
<div class="floaters"><div class="fl a">🏡 Priya's housewarming<b>$240 of $300</b></div><div class="fl b">🎓 A graduation surprise<b>$410 of $500</b></div><div class="fl c">💸 Rahul just gave $20</div></div></div>
<section class="glass pad"><h2>${reg?'Join the circle':'Welcome back'}</h2><p class="mute">${reg?'Two minutes, and your people can find you.':'Your moments kept the lights on for you.'}</p>
${reg?'<input id="n" placeholder="Your name">':''}<input id="e" type="email" placeholder="Email">${reg?'<input id="pe" type="email" placeholder="Your PayPal sandbox email (receives money owed to you)">':''}<input id="p" type="password" placeholder="Password">
<button class="btn" onclick="auth(${reg})">${reg?'Create my account':'Step inside'}</button><br><button class="link" onclick="authView(${reg?0:1})">${reg?'Already one of us? Log in':'New here? Create an account'}</button></section></div>`)}
const auth=run(async reg=>{const r=await api(reg?'/register':'/login','POST',{name:$('#n')?.value||'',email:$('#e').value,paypal_email:$('#pe')?.value||'',password:$('#p').value});T=r.token;localStorage.t=T;ME=await api('/me');ppGuard();route()});

const profileView=run(async()=>{clearInterval(POLL);CUR=0;VIEW='p';D=null;setH('profile');const p=await api('/profile');
 go(nav()+`<button class="link" onclick="home()">← Back</button><h1 style="font-size:2.4rem;margin:6px 0 14px">Your profile</h1><div class="dgrid">
 <section class="glass pad"><h3>About you</h3><p class="mute" style="margin-top:2px">Your friends find you by name. Your PayPal email is where money owed to you arrives.</p>
 <label>Name</label><input id="pf_n" value="${esc(p.name)}" maxlength="60">
 <label>Login email</label><input id="pf_e" type="email" value="${esc(p.email)}">
 <label>PayPal email</label><input id="pf_pe" type="email" value="${esc(p.paypal_email)}">
 <label>Phone (optional)</label><input id="pf_ph" type="tel" value="${esc(p.phone)}" placeholder="+91 98765 43210">
 <label>City (optional)</label><input id="pf_c" value="${esc(p.city)}" maxlength="60">
 <label>A line about you (optional)</label><textarea id="pf_a" style="min-height:80px" maxlength="280">${esc(p.about)}</textarea>
 <button class="btn" onclick="saveProfile()">Save changes</button></section>
 <section class="glass pad" style="align-self:start"><h3>Delete account</h3><p class="mute">This removes your account and the moments you organised. It is blocked while money is still in play in any moment you are part of.</p>
 <input id="pf_pw" type="password" placeholder="Your password to confirm"><button class="btn ghost" style="color:#ff9a9a;border-color:rgba(255,154,154,.45)" onclick="delAccount()">Delete my account</button></section></div>`)});
const saveProfile=run(async()=>{await api('/profile','PUT',{name:$('#pf_n').value,email:$('#pf_e').value,paypal_email:$('#pf_pe').value,phone:$('#pf_ph').value,city:$('#pf_c').value,about:$('#pf_a').value});ME=await api('/me');toast('Profile saved.','✅');profileView()});
const delAccount=run(async()=>{const pw=$('#pf_pw').value;if(!pw)throw new Error('type your password to confirm');if(!confirm('Delete your account for good? This cannot be undone.'))return;await api('/profile/delete','POST',{password:pw});logout(true);toast('Your account has been deleted. Take care.','👋')});

 if(!D.is_organiser||!['funded','asking','answered'].includes(D.status)||D.leftover<=0)return openM(id);
 SR=null;IDEAS=null;paintDecide();
 POLL=setInterval(async()=>{if(VIEW!='d'||document.hidden||$('#dec')?.contains(document.activeElement))return;try{const r=await api('/pulse?moment='+id);if(r.top>NMAX||r.unread!=NUN)npoll();if(!r.sig||JSON.stringify([r.sig[0],r.sig[2],r.sig[3]])==DSIG)return;const d=await api('/moments/'+id);D=d;if(d.leftover<=0)return openM(id);paintDecide()}catch(e){}},3000)});
function paintDecide(){const d=D,left=d.leftover,rc=d.recipient_choice,sv=$('#spec')?.value,bv=$('#bud')?.value;DSIG=JSON.stringify([d.status,d.leftover,rc]);
 if(!IDEAS&&d.kind!='emergency'){IDEAS=[];PLANITEMS=null;api(`/moments/${d.id}/plan-items`).then(r=>{PLANITEMS=r.items||[];PLANCTX=r.plan||'';if(PLANITEMS.length){const e=$('#ideas');if(e)e.innerHTML=itemsPanel();return}return api(`/moments/${d.id}/ideas`).then(x=>{IDEAS=x;const e=$('#ideas');if(e)e.innerHTML=chipsIdeas()})}).catch(()=>{})}
 const emer=d.kind=='emergency';
 go(nav()+`<div id="dec"><button class="link" onclick="openM(${d.id})">← Back to the moment</button>
 <div style="text-align:center;margin:8px 0 30px"><span class="tag g">pool sealed</span><h1 class="big" style="font-size:clamp(2.2rem,5vw,3.4rem);margin-top:8px">${money(left)} to place.</h1>
 <p class="sub" style="margin:6px auto">For ${esc(d.recipient_name)}'s ${esc(d.occasion)}. Choose how it reaches them.</p>
 ${rc=='money'?'<p class="why" style="display:inline-block">💛 They asked for the money.</p>':''}${rc=='gift'?`<p class="why" style="display:inline-block">💛 They would love: ${esc(d.recipient_spec)}</p>`:''}</div>
 <div class="dgrid">
 <div class="glass pad opt2"><div class="e">💸</div><h3>Send the money</h3><p class="mute">Straight to ${esc(d.recipient_name)}'s PayPal, in one tap.</p><button class="btn" onclick="act('payout','${emer?PAYL_CALM[0]:PAYL[0]}')">Send ${money(left)}</button></div>
 ${emer?'':`<div class="glass pad opt2"><div class="e">💌</div><h3>Confirm with ${esc(d.recipient_name)}</h3>${d.surprise?'<p class="mute">🤫 Surprise mode keeps this locked. They are never told.</p>':
   `<p class="mute">Let them choose between money and something they truly want.</p>${d.status=='funded'?`<button class="btn ghost" onclick="act('ask','Question sent with a bow on it.')">Ask them</button>`:'<p class="why">Waiting for their answer…</p>'}`}</div>`}
 <div class="glass pad opt2"><div class="e">🌿</div><h3>Return what's left</h3><p class="mute">Shared by how much each person gave.</p>${d.preview.map(p=>`<div class="row"><span class="grow">${esc(p.name)}</span><b>${money(p.amount)}</b></div>`).join('')}<button class="btn ghost" onclick="act('refund','${emer?"Every cent returned to those who gave.":"Every cent found its way home."}')">Return ${money(left)}</button></div>
 ${emer?'':`<div class="glass pad" style="grid-column:1/-1"><div style="display:flex;gap:12px;align-items:center"><div class="e" style="font-size:34px">🛍️</div><div><h3>Let Pip shop for it</h3><p class="mute" style="margin:0">Pip searches live stores for the things you planned together, within each item\'s share of the budget, checks each match and explains its pick.</p></div></div>
  <div id="ideas" style="margin-top:12px">${itemsPanel()}</div>
  <div style="display:grid;grid-template-columns:2fr 1fr;gap:10px"><input id="spec" placeholder="Or search anything else, e.g. scented candles, a good frying pan" value="${esc(rc=='gift'?d.recipient_spec:'')}"><input id="bud" type="number" placeholder="Budget (up to ${money(left)})"></div>
  <button class="btn" onclick="find()">Search the stores ✨</button><div id="res"></div></div>`}</div></div>`);
 if(!emer){if(sv!=null)$('#spec').value=sv;if(bv)$('#bud').value=bv;if(SR&&$('#res'))$('#res').innerHTML=resHtml()}}
const prodHtml=(p,i)=>`<div class="prod ${i==SR.pick?'best':''}"><img src="${esc(p.image)}" alt=""><div><b>${esc(p.title)}</b><br><span class="mute">${esc(p.store)} · ${p.rating?`★${p.rating}${p.reviews?` (${p.reviews})`:''} · `:''}${p.discount?`<s>${money(p.list_price)}</s> `:''}${money(p.price)}${p.delivery?' · '+esc(p.delivery):''}${p.weak?' · weak match':''}</span>${p.link?`<br><a class="link" href="${esc(p.link)}" target="_blank" rel="noopener">View at store ↗</a>`:''}</div>${i>=0?`<button class="btn sm ${i==SR.pick?'gold':'ghost'}" onclick="buy(${i})">Buy</button>`:''}</div>`;
const resHtml=()=>{const bd=`<span class="tag ${SR.source=='demo'?'g':''}">${SR.source=='channel3'?'🛒 Live store search · Channel3':SR.source=='google'?'🛒 Live Google Shopping':'🧪 Demo catalog'}</span> <span class="mute" style="font-size:13px">Budget ${money(SR.budget)}</span>`;
 if(SR.over&&SR.over.length)return bd+`<p class="why">${esc(SR.note)}</p>`+SR.over.map(p=>prodHtml(p,-1)).join('');
 if(!SR.candidates.length)return bd+`<p class="mute">${esc(SR.note||'Nothing matched.')}</p>`;
 return bd+(SR.note?`<p class="mute" style="font-size:13px">${esc(SR.note)}</p>`:'')+`<p class="why"><b>✨ Why Pip chose this:</b> ${esc(SR.reasoning)}</p>`+SR.candidates.map((p,i)=>prodHtml(p,i)).join('')};
addEventListener('hashchange',()=>{if(ME&&location.hash!==CURH){CURH=location.hash;route()}});
boot();
</script></body></html>
